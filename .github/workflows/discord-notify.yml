name: Discord Notification on Report Update

on:
  push:
    paths:
      - 'reports/*.md'
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 追加されたレポートを特定
        id: report
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD -- 'reports/*.md' | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Discordに通知
        if: steps.report.outputs.file != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/notify_discord.py "${{ steps.report.outputs.file }}"
